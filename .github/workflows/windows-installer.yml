# Aether-gate — build the Windows installer, and attach it to releases.
#
# WHY: the biggest group of hams run Windows, and until this there was no way in
# for them that did not start with "install Python". This builds
# Aether-gate-Setup-<ver>.exe: Next, Next, Finish -> a Start-menu icon that opens
# the Setup page. See packaging/windows/ for the build script and installer.
#
# PHASE 1 CONTENTS: Setup page + Icom LAN adapters + sim (Python + numpy only).
# Hamlib CAT radios and SDR dongles are not bundled yet.
#
# Same trigger shape as pi-image.yml:
#   pull_request   touching the package or packaging: build + smoke-test only,
#                  the installer kept as a 5-day run artifact. Nothing published.
#   release        published on the upstream repo: build from the tag, attach.
#   workflow_dispatch with a tag: build and attach for an existing release.
#
# UNSIGNED: Windows SmartScreen shows "Windows protected your PC" on first run
# (More info -> Run anyway) until the installer is code-signed, and a
# reputation-based antivirus may refuse it outright -- Norton blocked the first
# real install (2026-09-22). Hence the portable zip alongside the installer, and
# the published checksums. The README says both.
name: windows-installer

on:
  pull_request:
    paths:
      - "aether_gate/**"
      - "dossiers/**"
      - "packaging/windows/**"
      - ".github/workflows/windows-installer.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach to (e.g. v0.5.1)"
        required: true

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.event_name }}-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build the Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.ref.outputs.tag }}
    steps:
      - name: Resolve what to build
        id: ref
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            release)           tag="${{ github.event.release.tag_name }}" ;;
            workflow_dispatch) tag="${{ inputs.tag }}" ;;
            *)                 tag="" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Building: ${tag:-the PR head}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.tag || github.sha }}

      # A tag cut before packaging/windows existed has none: take the packaging
      # (only) from the commit this workflow runs at, as pi-image.yml does for
      # build-image.sh. The gate package itself stays exactly as tagged.
      - name: Use this workflow's packaging for a tag build
        if: steps.ref.outputs.tag != ''
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.sha }}"
          rm -rf packaging/windows && mkdir -p packaging
          git archive "${{ github.sha }}" packaging/windows | tar -x
          ls packaging/windows

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build dependencies
        run: python -m pip install numpy pyserial pyinstaller

      # --- the SDR stack (SoapySDR + rtl-sdr-blog V4 + libusb) ----------------
      # Built from the same pinned commits as deploy/install-pi.sh, so a dongle
      # behaves as it does on the Pi. Cached: it is the slow part, and the key is
      # the build script itself, which carries the pins.
      - name: Cache the SDR stack
        id: sdrcache
        uses: actions/cache@v4
        with:
          path: build/sdr-prefix
          key: sdr-${{ runner.os }}-py312-${{ hashFiles('packaging/windows/build_sdr.ps1') }}

      - name: SWIG (for the SoapySDR Python binding)
        if: steps.sdrcache.outputs.cache-hit != 'true'
        run: choco install swig -y --no-progress

      - name: Build the SDR stack
        if: steps.sdrcache.outputs.cache-hit != 'true'
        shell: pwsh
        run: pwsh packaging/windows/build_sdr.ps1 -PythonExe (Get-Command python).Source

      - name: Build the program folder
        run: python packaging/windows/build.py

      - name: Smoke-test the built program (no radio)
        shell: bash
        run: |
          set -euo pipefail
          exe=dist/AetherGate/AetherGate.exe
          "$exe" --help | head -3
          # the gate on its own: sim adapter, same-host ports, control panel up
          "$exe" --adapter sim --model FLEX-6700 --port 5992 --ctl-port 8741 > gate.log 2>&1 &
          gate=$!
          ok=0
          for i in $(seq 30); do
            if curl -fsS -m 2 http://127.0.0.1:8741/diagnostics | grep -q SimAdapter; then ok=1; break; fi
            sleep 1
          done
          kill $gate 2>/dev/null || true
          cat gate.log | tail -5
          [ "$ok" = 1 ] || { echo "the frozen gate never answered on its control port"; exit 1; }
          echo "frozen gate OK"

          # The dongle stack travels in three parts (DLLs, Python binding,
          # driver module) and is only proven together: the Setup page's own
          # health check must report SoapySDR as installed. No dongle on a
          # runner, so a device count of 0 is expected.
          # The Setup page needs a PIN now (GHSA-7q6h-3p42-22hp), and a health
          # check is not worth a login dance: AETHER_GATE_SETUP_OPEN is the
          # documented opt-out, used here and nowhere else.
          AETHER_GATE_SETUP_OPEN=1 "$exe" --setup --no-browser > setup.log 2>&1 &
          ui=$!
          known=""
          for i in $(seq 30); do
            known=$(curl -fsS -m 2 http://127.0.0.1:8730/api/known || true)
            [ -n "$known" ] && break
            sleep 1
          done
          kill $ui 2>/dev/null || true
          echo "$known" | grep -oE '"label": "(SoapySDR|dongles|numpy|pyserial)", "value": "[^"]*"' || true
          case "$known" in
            *'"label": "pyserial", "value": "not installed"'*)
              echo "pyserial did not travel - USB CI-V radios (IC-7300) would not connect"
              exit 1 ;;
          esac
          case "$known" in
            *'"label": "SoapySDR", "value": "installed"'*)
              echo "SoapySDR in the packaged program OK" ;;
            *)
              echo "the packaged program cannot import SoapySDR - the dongle stack did not travel"
              exit 1 ;;
          esac

          # "0 dongles" is right on a runner with no hardware -- and identical to
          # what a MISSING driver module produces, which is the failure this
          # packaging is most likely to have. So check the module is in the build
          # rather than inferring it from a device count.
          ls -l dist/AetherGate/_internal/soapy-modules/ || {
            echo "no soapy-modules directory: the RTL driver module did not travel"; exit 1; }
          ls dist/AetherGate/_internal/soapy-modules/ | grep -qi rtl || {
            echo "the RTL driver module is missing from soapy-modules"; exit 1; }
          echo "RTL driver module present OK"

      - name: Version for the installer
        id: ver
        shell: bash
        run: |
          v=$(python -c "import re;print(re.search(r'^__version__\s*=\s*\"([^\"]+)\"',open('aether_gate/__init__.py',encoding='utf-8').read(),re.M).group(1))")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $cand = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $cand)) { choco install innosetup -y --no-progress | Out-Null }
            $iscc = Get-Item $cand
          }
          & $iscc.Source /DAppVersion=${{ steps.ver.outputs.version }} packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist\Aether-gate-Setup-*.exe | ForEach-Object {
            # plain LF, not Out-File's CRLF: sha256sum -c on the Linux attach job
            # would otherwise read the filename with a trailing carriage return and fail.
            $line = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name + "`n"
            [IO.File]::WriteAllText($_.FullName + ".sha256", $line)
            "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB)
          }

      # A second route for a PC whose antivirus refuses an unsigned installer
      # (Norton blocked the first real install, 2026-09-22): unzip anywhere and
      # run AetherGate.exe. No installer, no admin, nothing written outside the
      # folder and %USERPROFILE%\.aether-gate.
      - name: Portable zip
        shell: pwsh
        run: |
          $zip = "dist\Aether-gate-$env:AG_VERSION-windows-portable.zip"
          Compress-Archive -Path dist\AetherGate\* -DestinationPath $zip -CompressionLevel Optimal
          $line = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  " + (Split-Path $zip -Leaf) + "`n"
          [IO.File]::WriteAllText("$zip.sha256", $line)
          "{0}  {1:N1} MB" -f (Split-Path $zip -Leaf), ((Get-Item $zip).Length / 1MB)
        env:
          AG_VERSION: ${{ steps.ver.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: aether-gate-windows-installer
          path: |
            dist/Aether-gate-Setup-*.exe
            dist/Aether-gate-Setup-*.exe.sha256
            dist/Aether-gate-*-windows-portable.zip
            dist/Aether-gate-*-windows-portable.zip.sha256
          retention-days: 5

  attach:
    name: attach to the release
    needs: build
    # Upstream only: a fork builds and verifies but never publishes anything.
    if: >-
      github.repository == 'nigelfenton/Aether-gate' &&
      (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aether-gate-windows-installer
          path: out
      - name: Verify the checksum before publishing
        run: cd out && sha256sum -c ./*.sha256
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: gh release upload "$TAG" out/* --clobber --repo "$GITHUB_REPOSITORY"
